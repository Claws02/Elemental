name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static sweep (module parse, dead private helpers)
        run: bash qa/parsecheck.sh src
      - name: Scenes (every scenes/*.json against the schema)
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/validate-scenes.mjs
      - name: Unit (saves, ledger, scene conditions)
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON qa/unit.mjs
      - name: Web build for Capacitor
        run: node scripts/build-web.js
      - name: Install Playwright Chromium
        run: npm install --no-save playwright@1.56 && npx playwright install --with-deps chromium
      - name: Smoke (boot, move, grab, flick, break, budget)
        run: |
          npx --yes http-server -p 8140 -s -c-1 . &
          npx --yes wait-on -t 30000 http://127.0.0.1:8140/index.html
          node qa/smoke.js
          node qa/lesson.js
          node qa/core.js
          node qa/creatures.js
          node qa/prologue.js
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-shots
          path: qa/shots/
